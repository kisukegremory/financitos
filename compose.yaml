x-app: &app
  build: .
  image: financitos:latest
  env_file: .env
  volumes:
    - ./data:/app/data

services:
  api:
    <<: *app
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # só localhost; na VPS acesse via VPN/SSH tunnel
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

  # CLI sob demanda: docker compose run --rm -T cli parse -s PicPay -i 2026-10 < data/fatura.txt
  cli:
    <<: *app
    profiles: ["cli"]
    stdin_open: true
