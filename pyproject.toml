[project]
name = "financitos"
version = "0.1.0"
description = "Categoriza lançamentos de fatura nas caixinhas do PicPay via LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
financitos = "financitos.cli:app"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
